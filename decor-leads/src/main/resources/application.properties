server.port=${PORT:8080}

# --- API keys (set as environment variables, never commit them) ---
google.places.key=${GOOGLE_PLACES_KEY:}
hunter.key=${HUNTER_KEY:}
sendgrid.key=${SENDGRID_KEY:}

# --- Sender details (CAN-SPAM requires a real postal address + working opt-out) ---
mail.from.email=${MAIL_FROM_EMAIL:sales@yourdomain.com}
mail.from.name=${MAIL_FROM_NAME:Your Company}
mail.postal.address=${MAIL_POSTAL_ADDRESS:Your Company, Full Street Address, City, Country}
app.public.url=${APP_PUBLIC_URL:http://localhost:8080}
